[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "css"
version = "1.2.0"
description = "PQC-aware Client-Selection Strategy for Federated Learning (Flower + PyTorch)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets[vision]>=0.6.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "pqcrypto>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.31.0"

[tool.flwr.app.components]
serverapp = "c_select.server_app:app"
clientapp = "c_select.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-train = 0.5
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.1
batch-size = 32
save-model = false
# One of: pqc_aware | random | data_size | loss_based | resource_aware | trust_based
selection-strategy = "pqc_aware"


