FedModel:
  name: FedSVD
  B: 8
  C: 1.0
  E: 1
  block_size: 1000
  distributed_evaluate: true
  fedsvd_debug_evaluate: false
  fedsvd_lr_l2: 0
  fedsvd_mode: lr
  fedsvd_opt_1: true
  fedsvd_opt_2: true
  fedsvd_top_k: -1
  max_rounds: 10000
  num_tolerance: 300
  rounds_between_val: 1
MLModel:
  name: MLP
  activation: relu
  dropout: 0.2
  units:
    - 512
    - 512
  optimizer:
    name: sgd
    lr: 0.001
    momentum: 0
  loss: categorical_crossentropy
  metrics:
    - accuracy
