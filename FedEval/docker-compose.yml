networks:
  server-clients:
    driver: bridge
services:
  container_0:
    cap_add:
    - NET_ADMIN
    command: sh -c "export CONTAINER_ID=0 && python3 -W ignore -m FedEval.run -f run
      -r client -c configs/quickstart"
    container_name: container0
    depends_on:
    - server
    deploy:
      resources:
        limits:
          cpus: '1'
    environment:
    - NVIDIA_VISIBLE_DEVICES=-1
    image: fedeval:v1
    networks:
    - server-clients
    volumes:
    - /home/simeonk1307/Projects/oelp-fedLearn/PQC_CSS/.trashyard/FedEval:/FML
    working_dir: /FML
